<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Alterar Usuário | Monit Ore</title>

    <link rel="stylesheet" href="./css/tela_cadastro.css" />
    <link rel="stylesheet" href="./css/editar_usuario.css" />
    <link rel="icon" href="./imgs/favicon.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="./js/meu_perfil.js"></script>
</head>

<body class="container_responsivo" data-permissao-pagina="usuarios">

    <aside class="navegacao">
        <div class="logo_navegacao">
            <img src="./imgs/LogoHeader.svg" alt="Monitore" />
        </div>

        <nav class="menu_navegacao">
            <ul>
                <li>
                    <a href="/selecao_torre.html" class="item_menu" id="torres" data-permissao="torres"
                        onclick="ativarTorres()">
                        <i class="fa-solid fa-tower-broadcast icone_menu"></i>
                        <span>Torres</span>
                    </a>
                </li>

                <li>
                    <a href="./cadastro.html" class="item_menu ativo" id="usuarios" data-permissao="usuarios"
                        onclick="ativarUsuarios()">
                        <i class="fa-solid fa-users icone_menu"></i>
                        <span>Usuários</span>
                    </a>
                </li>

                <li>
                    <a href="./cadastro_mineradora.html" class="item_menu" id="menu_mineradora"
                        data-permissao="mineradoras">
                        <i class="fa-solid fa-hammer icone_menu"></i>
                        <span>Cadastro de Mineradora</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="rodape_navegacao">
            <div id="perfil" onclick="ativarPerfil()">
                <div class="usuario_navegacao item_menu" id="usuario_logado">
                    <div class="avatar_usuario" id="avatar_usuario">
                        <i class="fa-sharp fa-regular fa-user" aria-hidden="true"></i>
                    </div>

                    <div class="info_usuario">
                        <span class="nome_usuario" id="nome_usuario">Carregando...</span>
                        <span class="cargo_usuario" id="cargo_usuario"></span>
                    </div>

                    <i class="fa-solid fa-chevron-right icone_menu"></i>
                </div>
            </div>

            <button class="botao_sair" id="botao_sair" type="button">
                <i class="fa-solid fa-right-from-bracket icone_menu"></i>
                <span>Sair</span>
            </button>
        </div>
    </aside>

    <div class="conteudo_layout">
        <header class="superior_tela">
            <button
            class="botao_voltar"
            type="button"
            onclick="voltar()"
            aria-label="Voltar"
            >
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            </button>    
            <div class="titulo_superior">
                <h1>Alterar Usuário</h1>
                <h2>Gerencie as informações dos usuários</h2>
            </div>
        </header>

        <main class="conteudo perfil_input">

            <section class="card_conteudo">
                <div class="superior_tela fundo_padrao">
                    <div class="avatar_usuario perfil_icon" id="avatar_usuario_2">
                        <i class="fa-sharp fa-regular fa-user" aria-hidden="true"></i>
                    </div>

                    <div class="titulo_superior">
                        <h1><span id="nome_user">Nome</span></h1>
                        <h2><span id="cargo">cargo</span> • <span id="email">email</span></h2>
                    </div>
                </div>
            </section>

            <section class="card_conteudo">
                <div class="titulo_cards">
                    <i class="fa-solid fa-user-gear" aria-hidden="true"></i>
                    <h1>Permissão do Usuário</h1>
                </div>

                <div class="divisao-btn-cargo">
                    <button type="button" class="desativado" onclick="mudarCargo(this)" value="Administrador">
                        Administrador
                    </button>

                    <button type="button" class="desativado" onclick="mudarCargo(this)" value="Operador">
                        Operador
                    </button>
                </div>
            </section>

            <section class="card_conteudo">
                <div class="titulo_cards">
                    <i class="fa-solid fa-phone" aria-hidden="true"></i>
                    <h1><label for="telefone_ipt">Telefone</label></h1>
                </div>

                <div class="container_formularios div_telefone">
                    <div class="formulario">
                        <label for="telefone_ipt">Novo número de telefone</label>

                        <input type="tel" id="telefone_ipt" placeholder="(00) 00000-0000" inputmode="tel"
                            autocomplete="tel" maxlength="15" />

                        <button type="button" class="btn-salvar" onclick="atualizarTelefone()">
                            <span>Salvar telefone</span>
                        </button>
                    </div>
                </div>
            </section>

            <section class="card_conteudo senhas">
                <div class="titulo_cards">
                    <i class="fa-solid fa-lock" aria-hidden="true"></i>
                    <h1><label for="senha_ipt">Alterar senha</label></h1>
                </div>

                <div class="container_formularios">
                    <div class="form_senhas">
                        <div class="formulario">
                            <label for="senha_ipt">Nova senha</label>

                            <div class="senha_container">
                                <input type="password" id="senha_ipt" placeholder="********" autocomplete="new-password"
                                    minlength="6" required />

                                <button type="button" class="botao_senha" onclick="mostrar_senha(2)"
                                    aria-label="Mostrar ou ocultar senha">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
                                </button>
                            </div>
                        </div>

                        <div class="formulario">
                            <label for="confirm_senha_ipt">Confirmar nova senha</label>

                            <div class="senha_container">
                                <input type="password" id="confirm_senha_ipt" placeholder="********"
                                    autocomplete="new-password" minlength="6" required />

                                <button type="button" class="botao_senha" onclick="mostrar_senha(3)"
                                    aria-label="Mostrar ou ocultar senha">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="button" class="btn-salvar" onclick="atualizarSenha()">
                    <span>Alterar senha</span>
                </button>

                <p id="mensagem_cadastro" class="mensagem_cadastro" aria-live="polite"></p>
            </section>

            <section class="card_conteudo acesso_torres">
                <div class="titulo_cards">
                    <i class="fa-solid fa-tower-broadcast" aria-hidden="true"></i>
                    <h1>Acesso às torres</h1>
                </div>

                <label class="descricao_acesso">
                    Defina quais torres de cada mineradora este usuário poderá visualizar.
                </label>

                <div id="lista_mineradoras" class="lista_mineradoras">
                    <label>Carregando mineradoras e torres...</label>
                </div>

                <p id="mensagem_acesso" class="mensagem_cadastro" aria-live="polite"></p>

                <button type="button" class="btn-salvar" onclick="salvarAcessosTorres()">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Salvar acessos</span>
                </button>
            </section>


            <div class="botoes">
                <button type="button" class="btn-cancelar" onclick="cancelar()">
                    ✕
                    <span>Cancelar</span>
                </button>
            </div>

        </main>
    </div>

    <script src="./js/permissao.js"></script>
    <script src="./js/cadastro.js"></script>

    <script>
        document.getElementById("usuario_logado").addEventListener("click", () => {
        window.location.href = "/meu_perfil.html";
        });


        var nome;
        var email;
        var cargo;

        var id = sessionStorage.ID_EDITAR_USUARIO;
        console.log(id);

        window.onload = function () {
            buscarDadosUsuario();
        };

        function buscarDadosUsuario() {
            fetch(`/usuarios/buscarID/${id}`, {
                method: "GET",
                headers: {
                    "Content-Type": "application/json",
                }
            })
                .then(function (resposta) {
                    if (resposta.ok) {
                        resposta.json().then(function (banco) {
                            console.log("Dados recebidos com sucesso", banco);

                            var usuario = banco[0];

                            nome = usuario.nome;
                            cargo = usuario.cargo;
                            email = usuario.email;

                            document.getElementById("nome_user").innerHTML = usuario.nome;
                            document.getElementById("cargo").innerHTML = usuario.cargo;
                            document.getElementById("email").innerHTML = usuario.email;

                            atualizarEstiloBotoesCargo(usuario.cargo);
                        });
                    } else {
                        console.log("Erro na resposta do servidor");
                    }
                })
                .catch(function (resposta) {
                    console.log("#ERRO", resposta);
                });
        }

        function atualizarTelefone() {
            let telefone = telefone_ipt.value.trim();

            fetch("/usuarios/atualizar/telefone", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    userServer: id,
                    telServer: telefone
                }),
            })
                .then(function (resposta) {
                    console.log("resposta: ", resposta);

                    if (resposta.ok) {
                        console.log("resposta está ok");
                    } else {
                        throw "Houve um erro ao tentar realizar a alteração!";
                    }
                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);
                });

            return false;
        }

        function atualizarSenha() {
            let senha = senha_ipt.value;
            let confirmacao_senha = confirm_senha_ipt.value;

            if (senha != confirmacao_senha) {
                console.log("erro");
                mostrarMensagem("As senhas não coincidem.", true);
                return;
            }

            fetch("/usuarios/atualizarSenhaAdmin", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    userServer: id,
                    senhaNovaServer: senha
                }),
            })
                .then(function (resposta) {
                    console.log("resposta: ", resposta);

                    if (resposta.ok) {
                        console.log("resposta está ok");
                        mostrarMensagem("Troca validada", true);
                    } else {
                        mostrarMensagem("Senha inválida.", true);
                    }
                });
        }

        function atualizarEstiloBotoesCargo(cargoAtual) {
            var btnAdmin = document.querySelector(
                'button[value="Administrador"]'
            );

            var btnOperador = document.querySelector(
                'button[value="Operador"]'
            );

            if (!btnAdmin || !btnOperador) {
                return;
            }

            btnAdmin.className = "desativado";
            btnOperador.className = "desativado";

            if (cargoAtual === "Administrador") {
                btnAdmin.className = "ativo";
            } else if (cargoAtual === "Operador") {
                btnOperador.className = "ativo";
            }
        }

        function mudarCargo(botao_mudar) {
            novoCargo = botao_mudar.value;

            if (novoCargo == cargo) {
                mostrarMensagem("Ele já tem esse cargo");
                return;
            }

            fetch("/usuarios/atualizarCargo", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    userServer: id,
                    senhaNovaServer: novoCargo
                }),
            })
                .then(function (resposta) {
                    console.log("resposta: ", resposta);

                    if (resposta.ok) {
                        console.log("resposta está ok");

                        cargo = novoCargo;
                        atualizarEstiloBotoesCargo(cargo);
                        document.getElementById("cargo").innerHTML = cargo;

                        mostrarMensagem("Troca validada", true);
                    } else {
                        mostrarMensagem("Cargo inválida.", true);
                    }
                });
        }


        var torresDisponiveis = [];
        var torresSelecionadas = [];

        function carregarAcessosTorres() {
            var idUsuario = sessionStorage.ID_EDITAR_USUARIO;
            var lista = document.getElementById("lista_mineradoras");

            if (!idUsuario) {
                lista.innerHTML = "<p>Não foi possível identificar o usuário.</p>";
                return;
            }

            Promise.all([
                fetch("/usuarios/torres"),
                fetch("/usuarios/torres/acessos/" + idUsuario)
            ])
                .then(function (respostas) {
                    console.log("Status /usuarios/torres:", respostas[0].status);
                    console.log("Status /usuarios/torres/acessos:", respostas[1].status);

                    if (!respostas[0].ok || !respostas[1].ok) {
                        throw new Error(
                            "Erro HTTP: torres = " + respostas[0].status +
                            ", acessos = " + respostas[1].status
                        );
                    }

                    return Promise.all([
                        respostas[0].json(),
                        respostas[1].json()
                    ]);
                })
                .then(function (dados) {
                    torresDisponiveis = dados[0];

                    torresSelecionadas = dados[1].map(function (item) {
                        return Number(item.torre_id_torre);
                    });

                    renderizarMineradoras();
                })
                .catch(function (erro) {
                    console.error("Erro ao carregar as torres:", erro);
                    lista.innerHTML = "<p>Erro ao carregar mineradoras e torres.</p>";
                });
        }

        function escaparHTML(valor) {
            return String(valor)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function renderizarMineradoras() {
            var lista = document.getElementById("lista_mineradoras");
            var mineradoras = [];

            for (var i = 0; i < torresDisponiveis.length; i++) {
                var torre = torresDisponiveis[i];
                var encontrada = false;

                for (var j = 0; j < mineradoras.length; j++) {
                    if (mineradoras[j].id === Number(torre.id_mineradora)) {
                        mineradoras[j].torres.push(torre);
                        encontrada = true;
                        break;
                    }
                }

                if (!encontrada) {
                    mineradoras.push({
                        id: Number(torre.id_mineradora),
                        nome: torre.nome_mineradora,
                        torres: [torre]
                    });
                }
            }

            if (mineradoras.length === 0) {
                lista.innerHTML = "<p>Nenhuma mineradora ou torre cadastrada.</p>";
                return;
            }

            lista.innerHTML = "";

            mineradoras.forEach(function (mineradora) {
                var htmlTorres = "";

                mineradora.torres.forEach(function (torre) {
                    var idTorre = Number(torre.id_torre);
                    var selecionada = torresSelecionadas.includes(idTorre);

                    htmlTorres += `
                <button
                    type="button"
                    class="botao_torre ${selecionada ? "selecionada" : ""}"
                    aria-pressed="${selecionada}"
                    onclick="alternarTorre(${idTorre})">
                    ${escaparHTML(torre.nome_torre)}
                </button>
            `;
                });

                lista.innerHTML += `
            <div class="item_mineradora">
                <div class="cabecalho_mineradora">
                    <div class="nome_mineradora">
                        <span class="icone_mineradora">
                            <i class="fa-solid fa-mountain-sun"></i>
                        </span>

                        <span>${escaparHTML(mineradora.nome)}</span>
                    </div>

                    <div class="torres_mineradora">
                        ${htmlTorres}

                        <button
                            type="button"
                            class="selecionar_todas"
                            onclick="alternarTodasTorres(${mineradora.id})">
                            Selecionar todas
                        </button>
                    </div>
                </div>
            </div>
        `;
            });
        }

        function alternarTorre(idTorre) {
            idTorre = Number(idTorre);

            var indice = torresSelecionadas.indexOf(idTorre);

            if (indice === -1) {
                torresSelecionadas.push(idTorre);
            } else {
                torresSelecionadas.splice(indice, 1);
            }

            renderizarMineradoras();
        }

        function alternarTodasTorres(idMineradora) {
            var torresMineradora = torresDisponiveis.filter(function (torre) {
                return Number(torre.id_mineradora) === Number(idMineradora);
            });

            var todasSelecionadas = torresMineradora.every(function (torre) {
                return torresSelecionadas.includes(Number(torre.id_torre));
            });

            torresMineradora.forEach(function (torre) {
                var idTorre = Number(torre.id_torre);
                var indice = torresSelecionadas.indexOf(idTorre);

                if (todasSelecionadas && indice !== -1) {
                    torresSelecionadas.splice(indice, 1);
                } else if (!todasSelecionadas && indice === -1) {
                    torresSelecionadas.push(idTorre);
                }
            });

            renderizarMineradoras();
        }

        function salvarAcessosTorres() {
            var idUsuario = sessionStorage.ID_EDITAR_USUARIO;
            var mensagem = document.getElementById("mensagem_acesso");

            fetch("/usuarios/torres/acessos/" + idUsuario, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    torres: torresSelecionadas
                })
            })
                .then(function (resposta) {
                    return resposta.json().then(function (dados) {
                        if (!resposta.ok) {
                            throw new Error(dados.mensagem || "Erro ao salvar os acessos.");
                        }

                        return dados;
                    });
                })
                .then(function (dados) {
                    mensagem.textContent = dados.mensagem;
                    mensagem.style.color = "#f5c400";
                })
                .catch(function (erro) {
                    console.error("Erro ao salvar acessos:", erro);
                    mensagem.textContent = erro.message;
                    mensagem.style.color = "#ff6b6b";
                });
        }

        document.addEventListener("DOMContentLoaded", function () {
            buscarDadosUsuario();
            carregarAcessosTorres();
        });

    </script>

</body>

</html>
