  <title>Monit Ore | Seleção de Torre</title>
  <script>
      (function () {
        if (!window.matchMedia || !window.matchMedia("(width > 900px)").matches) return;
        var raiz = document.documentElement;
        if (raiz.dataset.sidebar) return;
        var estado = "expanded";
        try {
          var salvo = window.localStorage.getItem("monitore.sidebar");
          if (salvo === "expanded" || salvo === "collapsed") estado = salvo;
        } catch (erro) {
          /* localStorage bloqueado: mantém o padrão expandido no desktop. */
        }
        raiz.dataset.sidebar = estado;
      })();
    </script>
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/selecao_torre.css" />
  <link rel="icon" href="./imgs/favicon.svg" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="./js/sair.js"></script>
</head>
