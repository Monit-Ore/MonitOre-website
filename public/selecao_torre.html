<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Monit Ore | Seleção de Torre</title>
  <script>
      (function () {
        if (!window.matchMedia || !window.matchMedia("(width > 900px)").matches) return;
        var raiz = document.documentElement;
        if (raiz.dataset.sidebar) return;
        raiz.dataset.sidebar = "collapsed";
      })();
    </script>
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/selecao_torre.css" />
  <link rel="icon" href="./imgs/favicon.svg" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="./js/sair.js"></script>
</head>

<body class="container_responsivo" data-permissao-pagina="torres">

  <aside class="navegacao" id="navegacao_lateral">

    <div class="logo_navegacao">
      <img src="./imgs/LogoHeader.svg" alt="MonitOre" />
      <img class="logo-reduzida" src="./imgs/logo-sidebar.svg" alt="" aria-hidden="true" />
    </div>

    <nav class="menu_navegacao" data-menu-compartilhado aria-label="Menu principal"></nav>
    <script src="./js/sidebar-menu.js"></script>

    <div class="rodape_navegacao">

      <a class="usuario_navegacao" id="usuario_logado" href="/meu_perfil.html" aria-label="Abrir meu perfil">
        <div class="avatar_usuario" id="avatar_usuario">US</div><span class="icone_perfil_recolhido" aria-hidden="true"><i class="fa-solid fa-user"></i></span>

        <div class="info_usuario">
          <span class="nome_usuario" id="nome_usuario">
            Carregando...
          </span>

          <span class="cargo_usuario" id="cargo_usuario"></span>
        </div>

        <i class="fa-solid fa-chevron-right icone_menu"></i>
      </a>

      <button class="botao_sair" id="botao_sair" type="button" aria-label="Sair">
        <i class="fa-solid fa-right-from-bracket icone_menu"></i>
        <span>Sair</span>
      </button>

    </div>
  </aside>


  <main class="conteudo_layout">
    <header style="display: flex;">
      <div style="display: flex; justify-content: space-between; width: 100%;">
        <div>
      <h1>Seleção de Torre</h1>
      <span>Selecione a torre que deseja verificar os dados</span>
          </div>
      <button class="btn-notificacao alternar-menu" type="button" data-menu-toggle aria-controls="navegacao_lateral" aria-expanded="false" aria-label="Alternar menu lateral">
        <i class="fa-regular fa-bell icone-sino"></i>
        <i class="fa-solid fa-bars icone-menu"></i>
      </button>
    </div>
    </header>

    <div class="container">

      <div class="header-box">
        <span>Lista de Torres</span>

        <a href="./cadastro_torre.html" class="btn-add" id="btn-cadastrar-nova-torre" data-permissao="gerenciar-torres">
          <span>Nova Torre</span>
          <i class="fa-solid fa-plus"></i>
        </a>
      </div>

      <div id="prioridade-group"></div>
      <div id="titulo-mineradora"></div>
      <div id="mineradora-group">
        <p class="lista-vazia">Carregando torres...</p>
      </div>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/animejs@4/dist/bundles/anime.umd.min.js"></script>

  <script src="./js/permissao.js"></script>
  <script src="./js/global.js"></script>
  <script src="./js/selecao_torre.js"></script>



</body>

</html>
