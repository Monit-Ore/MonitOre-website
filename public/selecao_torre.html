<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monit Ore | Seleção de Torre</title>

    <link rel="stylesheet" href="./css/tela_cadastro.css" />
    <link rel="stylesheet" href="./css/selecao_torre.css" />
    <link rel="icon" href="./imgs/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

  </head>
  <body class="container_responsivo">
    <aside class="navegacao">
      <div class="logo_navegacao">
        <div class="logo_container">
          <img id="yellow-icon" src="./imgs/logo_icon_yellow.png">
          <img id="letters" src="./imgs/logo_letters_white.png">
        </div>
</div
      </div>
      <nav class="menu_navegacao">
        <ul>
          <a
            href="/selecao_torre.html"
            class="item_menu ativo"
            id="torres"
            onclick="ativarTorres()"
          >
            <i class="fa-solid fa-tower-broadcast icone_menu"></i>
            <span>Torres</span>
          </a>
          <a
            href="/visualizacao_usuarios.html"
            class="item_menu"
            id="usuarios"
            onclick="ativarUsuarios()"
          >
            <i class="fa-solid fa-users icone_menu"></i>
            <span>Usuários</span>
          </a>
          <li class="item_menu" id="cargos" onclick="ativarCargos()">
            <i class="fa-solid fa-briefcase icone_menu"></i>
            <span>Cargos</span>
          </li>
          <li class="item_menu" id="alertas" onclick="ativarAlertas()">
            <i class="fa-solid fa-bell icone_menu"></i>
            <span>Alertas</span>
            <span class="notificacao_alerta" id="notificacao_alertas"></span>
          </li>
          <li class="item_menu" id="manual" onclick="ativarManual()">
            <i class="fa-solid fa-book icone_menu"></i>
            <span>Manual de Instalação</span>
          </li>
        </ul>
      </nav>

      <div class="rodape_navegacao">

        <div class="usuario_navegacao" id="usuario_logado">
          <div class="avatar_usuario" id="avatar_usuario">US</div>
          <div class="info_usuario">
            <span class="nome_usuario" id="nome_usuario">Carregando...</span>
            <span class="cargo_usuario" id="cargo_usuario"></span>
          </div>
          <i class="fa-solid fa-chevron-right icone_menu"></i>
        </div>

        <button class="botao_sair" id="botao_sair" type="button">
          <i class="fa-solid fa-right-from-bracket icone_menu"></i>
          <span>Sair</span>
        </button>
      </div>
    </aside>

    <main class="conteudo_layout">
      <header>
        <h1>Seleção de Torre</h1>
        <span>Selecione a torre que deseja verificar os dados</span>
      </header>
      <div class="container">
        <div class="header-box">
          <span>Mineradoras Parceiras</span>
          <a href="./cadastro_torre.html" class="btn-add">
            <span>Nova Torre</span>
            <i class="fa-solid fa-plus"></i>
          </a>
        </div>
        <div id="mineradora-group" class="mineradora-group">
          <span class="mineradora-nome">IBRAM</span>
          <div class="torres-scroll">
            <div class="torre-div">
              <div class="torre-card">
                <img
                  src="./imgs/institucional/LogoBanner.png"
                  class="torre-icon"
                  alt="Logo"
                />
                <span class="torre-status alerta">Alerta</span>
              </div>
              <span class="torre-codigo">Torre 002</span>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/animejs@4/dist/bundles/anime.umd.min.js"></script>
    <script src="./js/selecao_torre.js"></script>
    <script>
      usuario_logado.addEventListener("click", () => {
        window.location = '/meu_perfil.html';
      });
    </script>
  </body>
  
</html>
