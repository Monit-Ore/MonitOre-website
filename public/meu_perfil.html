<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Meu Perfil | Monit Ore</title>

  <link rel="stylesheet" href="./css/tela_cadastro.css" />
  <link rel="icon" href="./imgs/favicon.svg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body class="container_responsivo" data-permissao-pagina="perfil">

  <aside class="navegacao">
    <div class="logo_navegacao">
      <img src="./imgs/LogoHeader.svg" alt="Monitore" />
    </div>

    <nav class="menu_navegacao">
      <ul>
        <li>
          <a href="./dashboard-gerente.html" class="item_menu" id="dashboard-gerente" data-permissao="dashboard-gerente">
            <i class="fa-solid fa-chart-line icone_menu"></i>
            <span>Dashboard Gerente</span>
          </a>
        </li>

        <li>
          <a
            href="/selecao_torre.html"
            class="item_menu"
            id="torres"
            data-permissao="torres"
            onclick="ativarTorres()"
          >
            <i class="fa-solid fa-tower-broadcast icone_menu"></i>
            <span>Torres</span>
          </a>
        </li>

        <li>
          <a
            href="/visualizacao_usuarios.html"
            class="item_menu"
            id="usuarios"
            data-permissao="usuarios"
            onclick="ativarUsuarios()"
          >
            <i class="fa-solid fa-users icone_menu"></i>
            <span>Usuários</span>
          </a>
        </li>

        <li>
          <a
            href="./cadastro_mineradora.html"
            class="item_menu"
            id="menu_mineradora"
            data-permissao="mineradoras"
          >
            <i class="fa-solid fa-hammer icone_menu"></i>
            <span>Cadastro de Mineradora</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="rodape_navegacao">
      <div id="perfil" onclick="ativarPerfil()">
        <div class="usuario_navegacao item_menu ativo" id="usuario_logado">
          <div class="avatar_usuario" id="avatar_usuario">
            <i class="fa-sharp fa-regular fa-user" aria-hidden="true"></i>
          </div>

          <div class="info_usuario">
            <span class="nome_usuario" id="nome_usuario">Carregando...</span>
            <span class="cargo_usuario" id="cargo_usuario"></span>
          </div>

          <i class="fa-solid fa-chevron-right icone_menu"></i>
        </div>
      </div>

      <button class="botao_sair" id="botao_sair" type="button">
        <i class="fa-solid fa-right-from-bracket icone_menu"></i>
        <span>Sair</span>
      </button>
    </div>
  </aside>

  <div class="conteudo_layout">
    <header class="superior_tela">
      <button
        class="botao_voltar"
        type="button"
        onclick="voltar()"
        aria-label="Voltar"
      >
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
      </button>
      <div class="titulo_superior">
        <h1>Meu Perfil</h1>
        <h2>Gerencie suas informações pessoais e de segurança.</h2>
      </div>
      <div>
            <button class="btn-notificacao" type="button" aria-label="Abrir menu" >
        <i class="fa-regular fa-bell icone-sino"></i>
        <i class="fa-solid fa-bars icone-menu"></i>
      </button>
      </div>
    </header>

    <main class="conteudo perfil_input">

      <section class="card_conteudo">
        <div class="superior_tela fundo_padrao">
          <div class="avatar_usuario perfil_icon" id="avatar_usuario_2">
            <i class="fa-sharp fa-regular fa-user" aria-hidden="true"></i>
          </div>

          <div class="titulo_superior">
            <h1><span id="nome_user">Nome</span></h1>
            <h2><span id="cargo">cargo</span> • <span id="email">email</span></h2>
          </div>
        </div>
      </section>

      <section class="card_conteudo senhas">
        <div class="titulo_cards">
          <i class="fa-solid fa-phone" aria-hidden="true"></i>
          <h1><label for="telefone_ipt">Telefone</label></h1>
        </div>

        <div class="container_formularios">
          <div class="formulario">
            <label for="telefone_ipt">Número de telefone</label>
            <input
              type="tel"
              id="telefone_ipt"
              placeholder="(00) 00000-0000"
              inputmode="tel"
              autocomplete="tel"
              maxlength="15"
            />
            <p id="mensagem_telefone" class="mensagem_cadastro" aria-live="polite"></p>
          </div>
        </div>

        <div class="titulo_cards">
          <i class="fa-solid fa-lock" aria-hidden="true"></i>
          <h1><label for="cur_senha_ipt">Alterar senha</label></h1>
        </div>

        <div class="container_formularios">
          <div class="formulario">
            <label for="cur_senha_ipt">Senha atual</label>

            <div class="senha_container">
              <input
                type="password"
                id="cur_senha_ipt"
                placeholder="********"
                autocomplete="current-password"
                minlength="6"
              />

              <button
                type="button"
                class="botao_senha"
                onclick="mostrar_senha(1)"
                aria-label="Mostrar ou ocultar senha"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="form_senhas">
            <div class="formulario">
              <label for="senha_ipt">Nova senha</label>

              <div class="senha_container">
                <input
                  type="password"
                  id="senha_ipt"
                  placeholder="********"
                  autocomplete="new-password"
                  minlength="6"
                />

                <button
                  type="button"
                  class="botao_senha"
                  onclick="mostrar_senha(2)"
                  aria-label="Mostrar ou ocultar senha"
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
                </button>
              </div>
            </div>

            <div class="formulario">
              <label for="confirm_senha_ipt">Confirmar nova senha</label>

              <div class="senha_container">
                <input
                  type="password"
                  id="confirm_senha_ipt"
                  placeholder="********"
                  autocomplete="new-password"
                  minlength="6"
                />

                <button
                  type="button"
                  class="botao_senha"
                  onclick="mostrar_senha(3)"
                  aria-label="Mostrar ou ocultar senha"
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <button type="button" class="btn-salvar" id="salvar_perfil" onclick="salvarAlteracoesPerfil()">
          <span>Salvar alterações</span>
        </button>

        <p
          id="mensagem_cadastro"
          class="mensagem_cadastro"
          aria-live="polite"
        ></p>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/animejs@4/dist/bundles/anime.umd.min.js"></script>
  <script src="./js/permissao.js"></script>
  <script src="./js/cadastro.js"></script>

  <script>
    document.getElementById("nome_user").textContent = sessionStorage.NOME_USUARIO || "";
    document.getElementById("cargo").textContent = sessionStorage.CARGO_USUARIO || "";
    document.getElementById("email").textContent = sessionStorage.EMAIL_USUARIO || "";

    const id = sessionStorage.ID_USUARIO;
    const telefoneInput = document.getElementById("telefone_ipt");
    const senhaAtualInput = document.getElementById("cur_senha_ipt");
    const novaSenhaInput = document.getElementById("senha_ipt");
    const confirmarSenhaInput = document.getElementById("confirm_senha_ipt");
    const botaoSalvarPerfil = document.getElementById("salvar_perfil");
    let telefoneOriginal = "";

    async function carregarTelefonePerfil() {
      try {
        const resposta = await fetch(`/usuarios/buscarID/${encodeURIComponent(id)}`);
        if (!resposta.ok) throw new Error("Não foi possível carregar o telefone.");

        const usuarios = await resposta.json();
        telefoneOriginal = usuarios[0]?.telefone || "";
        telefoneInput.value = telefoneOriginal;
      } catch (erro) {
        console.error("Erro ao carregar o telefone do perfil:", erro);
        mostrarMensagemTel("Não foi possível carregar o telefone cadastrado.", true);
      }
    }

    function normalizarTelefone(telefone) {
      return telefone.replace(/\D/g, "");
    }

    async function salvarAlteracoesPerfil() {
      const telefone = telefoneInput.value.trim();
      const senhaAtual = senhaAtualInput.value;
      const novaSenha = novaSenhaInput.value;
      const confirmarSenha = confirmarSenhaInput.value;
      const solicitouTrocaSenha = Boolean(senhaAtual || novaSenha || confirmarSenha);
      const alterouTelefone = normalizarTelefone(telefone) !== normalizarTelefone(telefoneOriginal);

      if (!telefone) {
        mostrarMensagemTel("Informe um número de telefone.", true);
        return;
      }

      if (solicitouTrocaSenha && (!senhaAtual || !novaSenha || !confirmarSenha)) {
        mostrarMensagem("Preencha a senha atual, a nova senha e a confirmação.", true);
        return;
      }

      if (solicitouTrocaSenha && novaSenha !== confirmarSenha) {
        mostrarMensagem("As senhas não coincidem.", true);
        return;
      }

      if (!alterouTelefone && !solicitouTrocaSenha) {
        mostrarMensagem("Nenhuma alteração foi feita.", true);
        return;
      }

      botaoSalvarPerfil.disabled = true;
      try {
        // Salva a senha primeiro para não atualizar o telefone se a senha atual for inválida.
        if (solicitouTrocaSenha) {
          const respostaSenha = await fetch("/usuarios/atualizar/senha", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              userServer: id,
              senhaAtualServer: senhaAtual,
              senhaNovaServer: novaSenha,
              emailServer: sessionStorage.EMAIL_USUARIO
            })
          });

          if (!respostaSenha.ok) {
            throw new Error("Senha atual inválida ou não foi possível alterar a senha.");
          }
        }

        if (alterouTelefone) {
          const respostaTelefone = await fetch("/usuarios/atualizar/telefone", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ userServer: id, telServer: telefone })
          });

          if (!respostaTelefone.ok) {
            throw new Error("Não foi possível atualizar o telefone.");
          }

          telefoneOriginal = telefone;
        }

        senhaAtualInput.value = "";
        novaSenhaInput.value = "";
        confirmarSenhaInput.value = "";
        mostrarMensagem("Perfil atualizado com sucesso.", false);
        alert("Perfil atualizado com sucesso.");
      } catch (erro) {
        mostrarMensagem(erro.message || "Não foi possível atualizar o perfil.", true);
      } finally {
        botaoSalvarPerfil.disabled = false;
      }
    }

    carregarTelefonePerfil();
  </script>

</body>

</html>
