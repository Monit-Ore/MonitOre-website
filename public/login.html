<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | monitOre</title>

    <link rel="stylesheet" href="./css/login.css">

</head>
<body>
    <div class="banner_login">

        <a href="./index.html" class="botao_voltar" aria-label="Voltar">

            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                <path d="M20 12H5 M11 6L5 12L11 18" fill="none" stroke="currentColor" stroke-width="3"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </a>

        <main class="login_container">
            <section class="login_card">


                <h1>Login</h1>
                <form id="form_login" onsubmit="autenticar(); return false;">


                    <div class="campo">

                        <input type="email" id="email" name="email" placeholder="Email..." autocomplete="email"
                            required>

                    </div>


                    <div class="campo campo_senha">

                        <input type="password" id="senha" name="senha" placeholder="Senha..."
                            autocomplete="current-password" required>

                        <button type="button" id="botao_senha" class="botao_senha" onclick="mostrarSenha()"
                            aria-label="Mostrar senha">
                            👁
                        </button>

                    </div>

                    <p id="mensagem_login" class="mensagem_login"></p>

                    <button type="submit" id="botao_entrar" class="botao_entrar">
                        Entrar
                    </button>


                </form>

                <div class="cadastro">

                    <span>
                        Não é cadastrado?
                    </span>

                    <a href="./cadastro.html">
                        Cadastre-se
                    </a>

                </div>
            </section>
        </main>
    </div>


    <script src="./js/login.js"></script>


</body>

</html>
