<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastro de Funcionário</title>

    <link rel="stylesheet" href="./css/tela_cadastro.css" />

    <link rel="icon" href="./imgs/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body class="container_responsivo">
    <!-- Menu lateral -->
    <aside class="navegacao">
      <div class="logo_navegacao">
        <img src="./imgs/LogoHeader.svg" alt="Monitore" />
      </div>

      <nav class="menu_navegacao">
        <ul>
          <a
            href="/selecao_torre.html"
            class="item_menu"
            id="torres"
            onclick="ativarTorres()"
          >
            <i class="fa-solid fa-tower-broadcast icone_menu"></i>
            <span>Torres</span>
          </a>
          <a
            href="#"
            class="item_menu ativo"
            id="usuarios"
            onclick="ativarUsuarios()"
          >
            <i class="fa-solid fa-users icone_menu"></i>
            <span>Usuários</span>
          </a>
          <a href="#" class="item_menu" id="cargos" onclick="ativarCargos()">
            <i class="fa-solid fa-briefcase icone_menu"></i>
            <span>Cargos</span>
          </a>
          <a href="#" class="item_menu" id="alertas" onclick="ativarAlertas()">
            <i class="fa-solid fa-bell icone_menu"></i>
            <span>Alertas</span>
            <span class="notificacao_alerta" id="notificacao_alertas"></span>
          </a>
          <a href="#" class="item_menu" id="manual" onclick="ativarManual()">
            <i class="fa-solid fa-book icone_menu"></i>
            <span>Manual de Instalação</span>
          </a>
        </ul>
      </nav>

      <div class="rodape_navegacao">
        <div class="item_menu" data-pagina="configuracoes">
          <i class="fa-solid fa-gear icone_menu"></i>
          <span>Configurações</span>
        </div>

        <div class="usuario_navegacao" id="usuario_logado">
          <div class="avatar_usuario" id="avatar_usuario">US</div>
          <div class="info_usuario">
            <span class="nome_usuario" id="nome_usuario">Carregando...</span>
            <span class="cargo_usuario" id="cargo_usuario"></span>
          </div>
          <i class="fa-solid fa-chevron-right icone_menu"></i>
        </div>

        <button class="botao_sair" id="botao_sair" type="button">
          <i class="fa-solid fa-right-from-bracket icone_menu"></i>
          <span>Sair</span>
        </button>
      </div>
    </aside>

    <!-- Conteúdo principal -->
    <div class="conteudo_layout">
      <header class="superior_tela">
        <button
          class="botao_voltar"
          type="button"
          onclick="voltar()"
          aria-label="Voltar"
        >
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        </button>

        <div class="titulo_superior">
          <h1>Cadastro de Funcionário</h1>

          <h2>Preencha os dados do novo funcionário</h2>
        </div>

        <button
          class="botao_notificacao btn-notificacao"
          type="button"
          aria-label="Abrir menu"
        >
          <i class="fa-regular fa-bell icone-sino" aria-hidden="true"></i>
          <i class="fa-solid fa-bars icone-menu"></i>
        </button>
      </header>

      <main class="conteudo">
        <section class="card_conteudo">
          <div class="titulo_formulario">
            <h1>Dados do Usuário</h1>
          </div>

          <div class="container_formularios">
            <!-- Coluna esquerda -->
            <div class="formulario">
              <label for="nome_ipt"> Nome completo* </label>

              <input
                type="text"
                id="nome_ipt"
                placeholder="Digite o nome completo"
                autocomplete="name"
                required
              />

              <label for="email_ipt"> Digite o e-mail* </label>

              <input
                type="email"
                id="email_ipt"
                placeholder="Digite o e-mail"
                autocomplete="email"
                required
              />

              <label for="data_nasc_input"> Data de nascimento </label>

              <input type="date" id="data_nasc_input" />

              <label for="unidade_local_ipt"> Unidade/Local </label>

              <select id="unidade_local_ipt">
                <option value="">Selecione uma unidade</option>
              </select>
            </div>

            <!-- Coluna direita -->
            <div class="formulario">
              <label for="cpf_ipt"> CPF* </label>

              <input
                type="text"
                id="cpf_ipt"
                placeholder="000.000.000-00"
                inputmode="numeric"
                autocomplete="off"
                maxlength="14"
                required
              />

              <label for="senha_ipt"> Senha* </label>

              <div class="senha_container">
                <input
                  type="password"
                  id="senha_ipt"
                  placeholder="Digite sua senha"
                  autocomplete="new-password"
                  minlength="6"
                  required
                />

                <button
                  type="button"
                  class="botao_senha"
                  onclick="mostrar_senha()"
                  aria-label="Mostrar ou ocultar senha"
                >
                  👁
                </button>
              </div>

              <label for="telefone_ipt"> Telefone </label>

              <input
                type="tel"
                id="telefone_ipt"
                placeholder="(00) 00000-0000"
                inputmode="tel"
                autocomplete="tel"
                maxlength="15"
              />

              <label for="cargo_ipt"> Cargo* </label>

              <select id="cargo_ipt" required>
                <option value="">Selecione um cargo</option>
              </select>
            </div>
          </div>

          <!-- Status -->
          <div class="status">
            <h3>Status</h3>

            <p>Status do usuário</p>

            <div class="status-controle">
              <label class="troca">
                <input type="checkbox" id="status_ipt" checked />

                <span class="deslizar"></span>
              </label>

              <span class="texto-status"> Ativo </span>
            </div>
          </div>
        </section>

        <!-- Mensagem de sucesso ou erro -->
        <p
          id="mensagem_cadastro"
          class="mensagem_cadastro"
          aria-live="polite"
        ></p>

        <!-- Botões -->
        <div class="botoes">
          <button type="button" class="btn-cancelar" onclick="cancelar()">
            ✕

            <span>Cancelar</span>
          </button>

          <button type="button" class="btn-salvar" onclick="salvar()">
            🗁

            <span>Salvar Funcionário</span>
          </button>
        </div>
      </main>
    </div>

    <script src="./js/cadastro.js"></script>
  </body>
</html>
