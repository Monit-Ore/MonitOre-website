<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Mineradora</title>
    <link rel="stylesheet" href="./css/cadastro_mineradora.css" />
    <link rel="icon" href="./imgs/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body class="container_responsivo">
    
    <aside class="navegacao">
      <div class="logo_navegacao">
        <img src="./imgs/LogoHeader.svg" alt="Monitore" />
      </div>

      <nav class="menu_navegacao">
        <ul>
          <li>
            <a href="/selecao_torre.html" class="item_menu" id="menu_torres">
              <i class="fa-solid fa-tower-broadcast icone_menu"></i>
              <span>Torres</span>
            </a>
          </li>
        
          <li>
            <a href="./cadastro.html" class="item_menu" id="menu_usuarios">
              <i class="fa-solid fa-users icone_menu"></i>
              <span>Usuários</span>
            </a>
          </li>
           <li>
            <a href="#" class="item_menu ativo" id="menu_mineradora">
              <i class="fa-solid fa-hammer icone_menu"></i>
              <span>Cadastro de Mineradora</span>
            </a>
          </li>
          <li>
            <a href="#" class="item_menu" id="menu_alertas">
              <i class="fa-solid fa-bell icone_menu"></i>
              <span>Alertas</span>
              <span class="notificacao_alerta" id="notificacao_alertas"></span>
            </a>
          </li>
          <li>
            <a href="# " class="item_menu" id="menu_manual">
              <i class="fa-solid fa-book icone_menu"></i>
              <span>Manual de Instalação</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="rodape_navegacao">
        <div class="usuario_navegacao" id="usuario_logado">
          <div class="avatar_usuario" id="avatar_usuario">US</div>
          <div class="info_usuario">
            <span class="nome_usuario" id="nome_usuario">Carregando...</span>
            <span class="cargo_usuario" id="cargo_usuario"></span>
          </div>
          <i class="fa-solid fa-chevron-right icone_seta"></i>
        </div>

        <button class="botao_sair" id="botao_sair" type="button">
          <i class="fa-solid fa-right-from-bracket icone_menu"></i>
          <span>Sair</span>
        </button>
      </div>
    </aside>

    <div class="conteudo_layout">
      <header class="superior_tela">
        <button
          class="botao_voltar"
          type="button"
          onclick="voltar()"
          aria-label="Voltar"
        >
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        </button>

        <div class="titulo_superior">
          <h1>Cadastro de Mineradora</h1>
          <h2>Preencha os dados da nova mineradora</h2>
        </div>


      </header>

      <main class="conteudo">
        <section class="card_conteudo">
          <div class="titulo_formulario">
            <h1>Informações Gerais</h1>
          </div>

          <div class="container_formularios">
            <!-- Coluna esquerda -->
            <div class="formulario">
              <label for="nome_ipt">Razão Social</label>
              <input
                type="text"
                id="nome_ipt"
                placeholder="Ex: Brandao Tech"
                autocomplete="organization"
                required
              />

              <label for="email_ipt">E-mail</label>
              <input
                type="email"
                id="email_ipt"
                placeholder="email@exemplo.com"
                autocomplete="email"
                required
              />
            </div>

    
            <div class="formulario">
              <label for="cnpj_ipt">CNPJ</label>
              <input
                type="text"
                id="cnpj_ipt"
                placeholder="00.000.000/0000-00"
                inputmode="numeric"
                autocomplete="off"
                maxlength="18"
                required
              />
            </div>
          </div>
        </section>

   
        <p
          id="mensagem_cadastro"
          class="mensagem_cadastro"
          aria-live="polite"
        ></p>

        <!-- Botões de Ação -->
        <div class="botoes">
    
          <button type="button" class="btn-salvar" onclick="salvar()">
            <i class="fa-regular fa-floppy-disk"></i>
            <span>Salvar Mineradora</span>
          </button>
        </div>
      </main>
    </div>

 
    <script src="./js/cadastro_mineradora.js"></script>
  </body>
</html>
