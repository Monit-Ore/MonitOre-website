<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monit Ore | Cadastro de Torre</title>

    <link rel="stylesheet" href="./css/selecao_torre.css" />
    <link rel="icon" href="./imgs/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="./js/cadastro_torre.js"></script>
  </head>
  <body>
    <button class="btn-notificacao">
      <i class="fa-regular fa-bell icone-sino"></i>
      <i class="fa-solid fa-bars icone-menu"></i>
    </button>
    <header>
      <h1>Cadastro de Torre</h1>
      <span>Preencha as informações para cadastrar uma nova torre</span>
    </header>
    <main class="conteudo">
      <section class="card_conteudo">
        <div class="titulo_formulario">
          <h1>Dados do Usuário</h1>
        </div>

        <div class="container_formularios">
          <!-- Coluna esquerda -->
          <div class="formulario">
            <label for="nome_ipt"> Nome completo* </label>

            <input
              type="text"
              id="nome_ipt"
              placeholder="Digite o nome completo"
              autocomplete="name"
              required
            />

            <label for="email_ipt"> Digite o e-mail* </label>

            <input
              type="email"
              id="email_ipt"
              placeholder="Digite o e-mail"
              autocomplete="email"
              required
            />

            <label for="data_nasc_input"> Data de nascimento </label>

            <input type="date" id="data_nasc_input" />

            <label for="unidade_local_ipt"> Unidade/Local </label>

            <select id="unidade_local_ipt">
              <option value="">Selecione uma unidade</option>
            </select>
          </div>

          <!-- Coluna direita -->
          <div class="formulario">
            <label for="cpf_ipt"> CPF* </label>

            <input
              type="text"
              id="cpf_ipt"
              placeholder="000.000.000-00"
              inputmode="numeric"
              autocomplete="off"
              maxlength="14"
              required
            />

            <label for="senha_ipt"> Senha* </label>

            <div class="senha_container">
              <input
                type="password"
                id="senha_ipt"
                placeholder="Digite sua senha"
                autocomplete="new-password"
                minlength="6"
                required
              />

              <button
                type="button"
                class="botao_senha"
                onclick="mostrar_senha()"
                aria-label="Mostrar ou ocultar senha"
              >
                👁
              </button>
            </div>

            <label for="telefone_ipt"> Telefone </label>

            <input
              type="tel"
              id="telefone_ipt"
              placeholder="(00) 00000-0000"
              inputmode="tel"
              autocomplete="tel"
              maxlength="15"
            />

            <label for="cargo_ipt"> Cargo* </label>

            <select id="cargo_ipt" required>
              <option value="">Selecione um cargo</option>
            </select>
          </div>
        </div>

        <!-- Status -->
        <div class="status">
          <h3>Status</h3>

          <p>Status do usuário</p>

          <div class="status-controle">
            <label class="troca">
              <input type="checkbox" id="status_ipt" checked />

              <span class="deslizar"></span>
            </label>

            <span class="texto-status"> Ativo </span>
          </div>
        </div>
      </section>

      <!-- Mensagem de sucesso ou erro -->
      <p
        id="mensagem_cadastro"
        class="mensagem_cadastro"
        aria-live="polite"
      ></p>

      <!-- Botões -->
      <div class="botoes">
        <button type="button" class="btn-cancelar" onclick="cancelar()">
          ✕

          <span>Cancelar</span>
        </button>

        <button type="button" class="btn-salvar" onclick="salvar()">
          🗁

          <span>Salvar Funcionário</span>
        </button>
      </div>
    </main>
  </body>
</html>
