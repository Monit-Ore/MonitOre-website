<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastro de Funcionário</title>

    <link rel="stylesheet" href="css/tela_cadastro.css" />
  </head>

  <body class="container_responsivo">
    <div class="navegacao">voce pode nao acreditar</div>
    <div class="conteudo_layout">
      <div class="superior_tela">
        <div class="botao_voltar"></div>

        <div class="titulo_superior">
          <h1>Cadastro de Funcionário</h1>
          <h2>Preencha os dados do novo funcionário</h2>
        </div>

        <div class="botao_notificacao"></div>
      </div>

      <div class="conteudo">
        <div class="card_conteudo">
          <div class="titulo_formulario">
            <h1>Dados do Úsuario</h1>
          </div>
          <div class="container_formularios">
            <div class="formulario">
              <p>Nome completo</p>
              <input type="text" placeholder="Digite o nome completo" required>
              <p>Digite o e-mail</p>
              <input type="email" placeholder="Digite o e-mail" required>
              <p>Data de nascimento</p>
              <input type="date" placeholder="00/00/0000" required>
              <p>Unidade/Local</p>
              <input type="text" placeholder="Selecionar unidade" required>
            </div>
            
            <div class="formulario">
              <p>CPF</p>
              <input type="text" placeholder="000.000.000-00" required>
              <p>Senha</p>
              <input type="password" placeholder="Digite o nome completo" required>
              <p>Telefone</p>
              <input type="tel" placeholder="(00) 00000-0000" required>
              <p>Cargo</p>
              <input type="text" placeholder="Selecione o cargo " required>
            </div>
          </div>

          <div class="container_status">

          </div>
        </div>
      </div>
    </div>
  </body>
</html>
